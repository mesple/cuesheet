<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就快完成了｜Cue Sheet</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0EA;--paper:#FBFAF6;--ink:#28251D;--muted:#7A7974;--soft:#55534C;--line:#D4D1CA;--teal:#01696F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1A16;--paper:#24221D;--ink:#EDEBE4;--muted:#A3A19A;--soft:#C9C6BE;--line:#3B3932;--teal:#4FB3B8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.box{max-width:560px;margin:48px auto;padding:0 16px}
.card{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--ink);padding:28px 24px}
.kicker{font-size:12px;letter-spacing:.16em;color:var(--muted)}
h1{font-family:Georgia,"Noto Serif TC",serif;font-size:44px;letter-spacing:-.04em;line-height:1;margin:8px 0 18px}
h1 a{color:inherit;text-decoration:none}
h2{font-size:20px;margin:0 0 8px}
p{font-size:15px;color:var(--soft);margin:0 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.btn{display:inline-block;padding:9px 14px;border:1px solid var(--teal);color:var(--teal);text-decoration:none;font-size:14px;font-weight:700}
.btn.main{background:var(--teal);color:#fff}
small{display:block;font-size:12px;color:var(--muted);margin-top:16px}
.steps{margin:6px 0 16px;padding:0;list-style:none;counter-reset:n}
.steps li{counter-increment:n;position:relative;padding:0 0 12px 40px;font-size:15px;color:var(--soft)}
.steps li::before{content:counter(n);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;font-weight:700;text-align:center;line-height:26px}
.steps b{color:var(--ink)}
.tip{background:#EEF4F3;border-left:3px solid var(--teal);padding:10px 12px;font-size:14px;color:var(--soft);margin:4px 0 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip{background:#1E3233}}
.sub2{font-size:13px;color:var(--muted);margin:20px 0 0}
</style>
</head>
<body>
<div class="box"><div class="card">
  <div class="kicker">FILM MUSIC NEWSLETTER</div>
  <h1><a href="../">Cue Sheet</a></h1>
  <h2>就快完成了！</h2>
  <p>我們剛寄了一封確認信到你的信箱。</p>
  <ol class="steps">
    <li>打開寄件者 <b>CueSheetNews</b> 的來信。這封信是<b>英文</b>的，請放心。</li>
    <li>按下信裡的<b>「確認」按鈕</b>。</li>
    <li>看到「Thank you!」，就代表訂閱完成了。接著你會收到一封中文歡迎信。</li>
  </ol>
  <div class="tip">幾分鐘內沒收到確認信？請到「促銷內容」分頁或垃圾郵件匣找找看。<br>找到後，把它移回主要收件匣，之後的電子報才不會漏接。</div>
  <p class="sub2">等信的時候，可以先逛逛：</p>
  <div class="btns">
    <a class="btn main" href="../newsletter/">讀過去的電子報</a>
    <a class="btn" href="../event/">近期國內電影音樂活動</a>
  </div>
</div></div>
</body>
</html>
